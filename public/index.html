<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headshot</title>
    <link rel="icon" href="data:," />
    <link rel="modulepreload" href="/dist/game.js" />
    <style>
      :root {
        --panel: rgba(12, 16, 24, 0.82);
        --text: #f2f4f8;
        --muted: #a9b2c3;
        --accent: #ffcf4a;
        --danger: #ff4d4d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0c1018;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      [hidden] {
        /* biome-ignore lint/complexity/noImportantStyles: `hidden` must beat the id rules that set display. */
        display: none !important;
      }

      #menu {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        background: radial-gradient(circle at 50% 40%, rgba(20, 28, 44, 0.75), rgba(6, 8, 12, 0.95));
      }
      #menu h1 {
        margin: 0 0 8px;
        font-size: clamp(40px, 9vw, 84px);
        letter-spacing: 0.08em;
        font-weight: 900;
      }
      #menu h1 span {
        color: var(--accent);
      }
      #menu input,
      #menu button {
        font: inherit;
        font-size: 18px;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid #3a4458;
        width: min(320px, 80vw);
      }
      #menu input {
        background: #141a26;
        color: var(--text);
      }
      #menu button {
        background: var(--accent);
        color: #14110a;
        font-weight: 800;
        border: none;
        cursor: pointer;
      }
      #menu button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #menu-status {
        min-height: 1.4em;
        margin: 0;
        color: var(--muted);
      }
      .controls {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 520px;
        line-height: 1.6;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7);
      }
      #hitmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        opacity: 0;
        background:
          linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%),
          linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
      }
      #hitmarker.head {
        filter: drop-shadow(0 0 3px var(--danger)) sepia(1) saturate(8) hue-rotate(-30deg);
      }
      #damage-flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        box-shadow: inset 0 0 120px 30px rgba(255, 0, 0, 0.55);
      }
      #stats {
        position: absolute;
        left: 24px;
        bottom: 20px;
        display: flex;
        gap: 18px;
        align-items: baseline;
        font-weight: 800;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      }
      #hp {
        font-size: 44px;
      }
      #stats small {
        font-size: 16px;
        color: var(--muted);
        margin-left: 4px;
      }
      #grenades {
        font-size: 28px;
      }
      #kill-feed {
        position: absolute;
        top: 16px;
        right: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
        justify-items: end;
      }
      #kill-feed li {
        background: var(--panel);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 15px;
      }
      #kill-feed .icon {
        margin: 0 8px;
        color: var(--accent);
      }
      #center-message {
        position: absolute;
        top: 30%;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: 800;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }
      #click-to-play {
        position: absolute;
        top: 58%;
        width: 100%;
        text-align: center;
        font-size: 20px;
        color: var(--accent);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      #scoreboard {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        min-width: min(460px, 92vw);
        background: var(--panel);
        border-radius: 10px;
        padding: 14px 18px;
      }
      #scoreboard table {
        width: 100%;
        border-collapse: collapse;
        font-size: 17px;
      }
      #scoreboard th {
        text-align: left;
        color: var(--muted);
        font-weight: 600;
        padding-bottom: 8px;
      }
      #scoreboard td,
      #scoreboard th {
        padding: 5px 8px;
      }
      #scoreboard .number {
        text-align: right;
        width: 70px;
      }
      #scoreboard tr.me td {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="crosshair"></div>
      <div id="hitmarker"></div>
      <div id="damage-flash"></div>
      <div id="stats">
        <span><span id="hp">100</span><small>HP</small></span>
        <span><span id="grenades">2</span><small>grenades</small></span>
      </div>
      <ul id="kill-feed"></ul>
      <div id="center-message"></div>
      <div id="click-to-play">Click to play</div>
      <div id="scoreboard" hidden>
        <table>
          <thead>
            <tr>
              <th>Player</th>
              <th class="number">Kills</th>
              <th class="number">Deaths</th>
            </tr>
          </thead>
          <tbody id="scoreboard-rows"></tbody>
        </table>
      </div>
    </div>

    <form id="menu">
      <h1>HEAD<span>SHOT</span></h1>
      <input id="name" maxlength="16" autocomplete="off" placeholder="Your name" required />
      <button id="play" type="submit" disabled>Loading…</button>
      <p id="menu-status"></p>
      <p class="controls">
        WASD move · Mouse aim · Click shoot · Space jump · G grenade · Hold Tab for scores · Esc
        frees the mouse
      </p>
    </form>

    <script type="module" src="/dist/game.js"></script>
  </body>
</html>
